# Builds and smoke-tests the portable app for Windows x64, macOS Apple Silicon and macOS Intel.
# PyInstaller cannot cross-compile, so each OS is built on its own GitHub-hosted runner.
# Nothing needs to be installed on your computer: download the zips from the run's "Artifacts"
# (or from the GitHub Release when you push a tag like v0.2.0).
name: Build portable app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: JobSearchManager-Windows-x64
            zip: dist/JobSearchManager-Windows-x64.zip
          - os: macos-15          # Apple Silicon (arm64)
            artifact: JobSearchManager-macOS-arm64
            zip: dist/JobSearchManager-macOS-arm64.zip
          - os: macos-15-intel    # Intel (x86_64)
            artifact: JobSearchManager-macOS-x86_64
            zip: dist/JobSearchManager-macOS-x86_64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build (Windows) - tests + PyInstaller + zip
        if: runner.os == 'Windows'
        shell: cmd
        env:
          PYTHON: python
        run: call build.bat

      - name: Build (macOS) - tests + PyInstaller + zip
        if: runner.os == 'macOS'
        env:
          PYTHON: python
        run: bash build_mac.sh

      - name: Smoke test packaged app (moved folder, no Python on PATH)
        run: python packaging/smoke_test.py ${{ matrix.zip }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub Release with the three zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.zip --repo "${GITHUB_REPOSITORY}" --generate-notes
